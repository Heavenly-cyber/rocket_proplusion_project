[project]
name = "rocket-nozzle-llm"
version = "0.3.0"
description = "Reproducible local LLM reliability study for an ideal rocket nozzle"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "bm25s==0.3.13",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "pypdf==6.20.1",
    "pint==0.26.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/project.py" = ["E402"]
